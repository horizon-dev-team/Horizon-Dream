name: Auto-Label - Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  process-labels:
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open'

    steps:
      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            Horizon-Test
            horizon-scripts

      - name: Download scripts
        env:
          GH_TOKEN: ${{ steps.app-token-generation.outputs.token }}
        run: |
          gh api repos/horizon-dev-team/horizon-scripts/contents/AutoLabel/autoLabelIssues.js --jq '.content' | base64 -d > autoLabelIssues.js
          ls -la *.js

      - name: Parse and add labels based on checkboxes
        id: process_issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token-generation.outputs.token }}
          script: |
            const { processIssueLabelsAndBody } = await import('${{ github.workspace }}/autoLabelIssues.js');
            return await processIssueLabelsAndBody({ github, context, core });
